<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="g" x1="12" y1="52" x2="52" y2="12" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3ee6a8"/>
      <stop offset=".55" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <radialGradient id="glow" cx="32" cy="38" r="13" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3ee6a8" stop-opacity=".6"/>
      <stop offset="1" stop-color="#3ee6a8" stop-opacity="0"/>
