<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="g" x1="12" y1="52" x2="52" y2="12" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3ee6a8"/>
      <stop offset=".55" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <radialGradient id="core" cx="32" cy="32" r="12" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3ee6a8" stop-opacity=".75"/>
      <stop offset="1" stop-color="#3ee6a8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1a1a1d"/>
      <stop offset="1" stop-color="#070708"/>
    </linearGradient>
  </defs>
  <!-- onyx tile -->
  <rect width="64" height="64" rx="15" fill="url(#sheen)"/>
  <rect x=".75" y=".75" width="62.5" height="62.5" rx="14.25" fill="none" stroke="#ffffff" stroke-opacity=".1" stroke-width="1.5"/>
  <!-- tesseract: a cube within a cube, corners joined, turned 45° like a cut gem -->
  <g transform="rotate(45 32 32) translate(32 32) scale(.78) translate(-32 -32)" fill="none" stroke="url(#g)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M13 13 L23 23 M51 13 L41 23 M13 51 L23 41 M51 51 L41 41" stroke-width="3" stroke-opacity=".8"/>
    <rect x="13" y="13" width="38" height="38" rx="3" stroke-width="4.5"/>
    <rect x="23" y="23" width="18" height="18" rx="2" stroke-width="4"/>
  </g>
  <!-- contained energy -->
  <rect x="23" y="23" width="18" height="18" fill="url(#core)" transform="rotate(45 32 32) translate(32 32) scale(.78) translate(-32 -32)"/>
  <circle cx="32" cy="32" r="3" fill="#eef2f7"/>
</svg>
